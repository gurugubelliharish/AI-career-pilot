services:
  postgres:
    image: postgres:16-alpine
    container_name: aicareer-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aicareer}
      POSTGRES_USER: ${POSTGRES_USER:-aicareer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicareer}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aicareer_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aicareer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aicareer-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-aicareer}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aicareer_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aicareer}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Ollama (local LLM server) ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: aicareer-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - aicareer_net
    restart: unless-stopped
    healthcheck:
      # 'ollama list' exits 0 when the server is ready
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ── One-time model pull (runs once on first docker-compose up) ──────────────
  # After models are in the ollama_data volume, subsequent starts skip the pull.
  ollama-init:
    image: ollama/ollama:latest
    container_name: aicareer-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - aicareer_net
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling llama3.2..." &&
        ollama pull llama3.2 &&
        echo "Pulling nomic-embed-text..." &&
        ollama pull nomic-embed-text &&
        echo "All models ready."
    volumes:
      - ollama_data:/root/.ollama
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicareer-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aicareer}
      DB_USERNAME: ${POSTGRES_USER:-aicareer}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aicareer}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-aicareer}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-256-bit-key}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-AIJobRadarBot}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - aicareer_net
    restart: unless-stopped
    volumes:
      - resume_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: aicareer-frontend
    networks:
      - aicareer_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: aicareer-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - aicareer_net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  resume_uploads:

networks:
  aicareer_net:
    driver: bridge
